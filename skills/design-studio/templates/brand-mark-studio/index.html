<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/heavy-chain-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renzo Atelier — Design Studio Workbench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        const theme = new URLSearchParams(window.location.search).get('theme');
        if (theme === 'dark' || theme === 'hc-dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'hc-dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'hc-light');
        }
      })();
    </script>
  </head>
  <body class="bg-base-100 text-base-content antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
